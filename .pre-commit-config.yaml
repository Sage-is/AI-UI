# =============================================================================
# Pre-commit Git Hooks — Fast Developer Feedback
# =============================================================================
# These hooks run automatically on every `git commit` via the pre-commit
# framework (https://pre-commit.com). They catch common issues BEFORE code
# reaches the repo.
#
# IMPORTANT: These are a developer convenience, NOT a security boundary.
# Hooks run client-side and can be bypassed with --no-verify.
# The authoritative security gate is: make scan
#
# Setup:   make install_dev          (installs tools + wires hooks)
# Manual:  pre-commit run --all-files (run all hooks on all files)
# Update:  pre-commit autoupdate     (bump hook versions)
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # Secrets Detection — catch accidentally committed keys/tokens
  # ---------------------------------------------------------------------------
  # Gitleaks is a single Go binary. Fully local, zero network calls.
  # Config: .gitleaks.toml (project-specific allowlists)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Private-data tree scan — pre-push backstop (whole tree, not just staged)
  # ---------------------------------------------------------------------------
  # The gitleaks hook above scans the STAGED diff at commit time. This runs the
  # same rules (.gitleaks.toml) across the ENTIRE working tree at push time,
  # catching anything a bypassed commit (--no-verify) let through before it
  # leaves the machine. Local-first: same `make scan_tree` you can run by hand.
  - repo: local
    hooks:
      # always_run is load-bearing, not decoration. `pass_filenames: false` only
      # says "do not hand the hook a file list"; it does NOT say "run when the
      # list is empty". pre-commit defaults always_run to false, so a push whose
      # ref range contains no new commits — a TAG push, most of all — skips every
      # hook here with "(no files to check)". Observed 2026-08-12 on the v3.1.0
      # tag repair: all eight hooks skipped. These two scan the whole tree and
      # the whole host, so the file list was never their input anyway.
      - id: scan-tree
        name: private-data scan (gitleaks --no-git, whole tree)
        entry: make scan_tree
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Every gate that needs nothing but this host: no image, no container.
      # Seconds, not minutes, and that is the design rather than a happy accident.
      # The FULL gauntlet was wired to a pre-push hook once, in .githooks/pre-push,
      # and never switched on — it cost minutes, so it shipped with two SKIP_ escape
      # hatches, and a hook people bypass protects nothing. Everything heavier lives
      # in `make gauntlet_full` and on the CI runner.
      #
      # gauntlet_fast also carries the four *_teeth gates, which prove their gate
      # can still fail. Before this, not one of them ran anywhere.
      #
      # always_run: see the note on scan-tree above. Without it this hook — and
      # so `tags_annotated`, the device whose entire job is refusing a bad TAG
      # push — could not fire on a tag push. The gate looked wired and was inert
      # at exactly the moment it existed for.
      - id: gauntlet-fast
        name: host-only gauntlet (gates + teeth, no image)
        entry: make gauntlet_fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ---------------------------------------------------------------------------
  # Python Security — catch common security bugs in backend code
  # ---------------------------------------------------------------------------
  # Bandit checks Python AST for security anti-patterns.
  # Config: .bandit.yaml (skipped rules, excluded dirs)
  # Only runs on backend Python files (not frontend, not migrations).
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", ".bandit.yaml", "-ll"]
        files: ^app/backend/

  # ---------------------------------------------------------------------------
  # Spell Checking — catch typos in code and comments
  # ---------------------------------------------------------------------------
  # Uses existing [tool.codespell] config in app/pyproject.toml.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # Vendored and minified third-party code is not ours to spell-check:
        # a minifier's variable names (te, ue, Ot) read as typos forever, and
        # "fixing" them would corrupt the dependency.
        exclude: '(\.svg|bun\.lock|\.lock|\.css|.*-bundle\.js|\.min\.js|/vendor/|emoji-shortcodes.*\.json|i18n/locales/)'
        args: ["--ignore-words-list", "ans,whats"]
        additional_dependencies:
          - tomli  # needed for pyproject.toml config reading

  # ---------------------------------------------------------------------------
  # Basic Hygiene — zero-cost safety nets
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Catch leftover merge conflict markers (<<<<<<, ======, >>>>>>)
      - id: check-merge-conflict

      # Prevent committing large binary files by accident (>500KB)
      - id: check-added-large-files
        args: ["--maxkb=500"]

      # Normalize trailing whitespace
      - id: trailing-whitespace
        exclude: ^app/node_modules/

  # ---------------------------------------------------------------------------
  # Outreach Privacy — block private drafts from leaking into the public repo
  # ---------------------------------------------------------------------------
  # docs/outreach/ holds pre-send drafts that name prospects, schools, and
  # pricing. The .gitignore handles plain `git add`. This hook is the second
  # line: it refuses commits that include anything from that folder other
  # than README.md, catching `git add -f` (which bypasses .gitignore).
  - repo: local
    hooks:
      - id: block-outreach-drafts
        name: block outreach drafts (privacy poka-yoke)
        entry: bash -c 'echo "" >&2; echo "[ABORT] Outreach draft(s) staged for commit:" >&2; for f in "$@"; do echo "  - $f" >&2; done; echo "" >&2; echo "docs/outreach/ is private. Only README.md is tracked." >&2; echo "Drafts name real prospects — they must not enter the public repo." >&2; echo "If you genuinely need to commit one, edit .gitignore and this hook first." >&2; exit 1' --
        language: system
        files: ^docs/outreach/
        exclude: ^docs/outreach/README\.md$
        pass_filenames: true
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # distribution.env agreement — Tri-repo Jidoka poka-yoke
  # ---------------------------------------------------------------------------
  # distribution.env is copied across AI-UI, homebrew-apps and
  # Sage.Education-docs. This hook refuses a commit while a sibling's copy
  # differs from ours, and `make distribution_sync` publishes ours to them.
  #
  # It was a HARDLINK until 2026-08-13. That propagated instantly and needed no
  # sync, but it broke silently — any atomic-save, `cp`, or macOS `sed -i`
  # replaces the inode and leaves byte-identical files with nothing to stage —
  # and a hardlink has no owner, so repairing one meant arbitrating a winner.
  # Copies make the drift a diff, which a human can read and settle.
  - repo: local
    hooks:
      # `files: ^distribution\.env$` used to gate this, which made it inert for
      # the failure it exists to catch: the file can drift with NO content change
      # in THIS repo, so nothing stages and the hook never runs. always_run costs
      # 0.17s; the drift costs a release.
      - id: distribution-chain-verify
        name: distribution.env matches siblings
        entry: make -s distribution_verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # The post-checkout/merge/rewrite healer is GONE with the hardlink it
      # repaired. Git rewriting the file in place no longer severs anything,
      # because there is nothing shared to sever — each repo holds its own copy.

  # ---------------------------------------------------------------------------
  # Dependency Audit — catch known CVEs in lockfiles before commit
  # ---------------------------------------------------------------------------
  # Runs Trivy against lockfiles when they change.
  # Trivy is installed via `make install_dev`. Fully local, uses cached DB.
  # This is a convenience check — the authoritative gate is: make scan_deps
  - repo: local
    hooks:
      - id: audit-deps
        name: audit-deps (trivy lockfile scan)
        entry: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1
        language: system
        files: (bun\.lock|requirements\.txt)$
        pass_filenames: true
        stages: [pre-commit]
