name: security-scan

# Server-side backstop for the local pre-commit / pre-push hooks, which are
# bypassable (`git commit --no-verify`, `SKIP_GAUNTLET=1`) and require a manual
# `make install_dev`. This runs the SAME target developers run locally —
# `make scan_secrets` — so there is one definition of "the scan", not two.

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history — gitleaks walks every commit

      - name: Install gitleaks (pinned to the .pre-commit-config.yaml rev)
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets + org-private data
        run: make scan_secrets   # gitleaks detect --source . --config .gitleaks.toml
