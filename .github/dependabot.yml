# Watch what the image installs: app/backend/requirements.txt and app/bun.lock
# (see the Dockerfile). app/pyproject.toml installs nothing, so it is not watched.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app/backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
      backend-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, python, backend]

  # bun, not npm: the build runs `bun install --frozen-lockfile`, so a PR must update bun.lock.
  - package-ecosystem: bun
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      svelte-security:
        applies-to: security-updates
        patterns: ["*"]
      svelte-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, javascript, frontend]

  - package-ecosystem: npm
    directory: /tools/tw2startr
    schedule:
      interval: monthly
    groups:
      tw2startr-all:
        patterns: ["*"]
    open-pull-requests-limit: 2
    labels: [dependencies, javascript, tooling]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
