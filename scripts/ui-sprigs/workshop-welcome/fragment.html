<!-- ui-Sprig™: workshop-welcome
     A first-party example of the fragment contract, and the one a Sprig author
     should read before writing their own.

     It is markup. No script, no external reference, nothing framed. That is not
     a limitation of this example — it is the whole default contract, and a
     fragment written this way grafts on any Rootstock without an admin having
     to grant it anything.

     Styling comes from fragment.css beside this file, which follows the same
     self-containment rules a theme's stylesheet does. -->
<div class="sprig-welcome">
  <h2 class="sprig-welcome-title"><!-- Welcome to sprig title --></h2>
  <p class="sprig-welcome-lede">
    <!-- Welcome to sprig lede -->
  </p>
  <ul class="sprig-welcome-list">
    <li><!-- Welcome to sprig list item --></li>
  </ul>
</div>
